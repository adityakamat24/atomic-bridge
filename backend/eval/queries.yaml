# ============================================================
# LOOKUP QUERIES (8)
# ============================================================

- id: lookup_001
  category: lookup
  query: "What's the status of John Doe's VPN issue?"
  expected:
    intent: lookup
    operations_required: [find, traverse, resolve]
    answer_must_contain: ["INC0012345", "In Progress"]
    answer_must_not_contain: ["sys_id", "usr001"]
  tags: [single_hop, by_name]

- id: lookup_002
  category: lookup
  query: "Show me all open high-priority incidents"
  expected:
    intent: lookup
    operations_required: [find, resolve]
    answer_must_contain: ["INC0012345", "INC0012348", "INC0012349"]
    answer_must_not_contain: ["Resolved", "Closed"]
  tags: [filter_by_value_map]

- id: lookup_003
  category: lookup
  query: "Who is assigned to the shared drive problem?"
  expected:
    intent: lookup
    operations_required: [find, resolve]
    answer_must_contain: ["Priya Patel"]
    answer_must_not_contain: ["usr005", "sys_id"]
  tags: [reference_resolution]

- id: lookup_004
  category: lookup
  query: "What incidents are unassigned right now?"
  expected:
    intent: lookup
    operations_required: [find, resolve]
    answer_must_contain: ["INC0012346"]
  tags: [filter_null]

- id: lookup_005
  category: lookup
  query: "Tell me about incident INC0012347"
  expected:
    intent: lookup
    operations_required: [find, resolve]
    answer_must_contain: ["Badge", "On Hold", "Mike Wilson"]
  tags: [by_number]

- id: lookup_006
  category: lookup
  query: "Which incidents are in the Network category?"
  expected:
    intent: lookup
    operations_required: [find, resolve]
    answer_must_contain: ["INC0012345"]
  tags: [by_category]

- id: lookup_007
  category: lookup
  query: "Show me Sarah Chen's tickets"
  expected:
    intent: lookup
    operations_required: [find, traverse, resolve]
    answer_must_contain: ["INC0012347"]
  tags: [single_hop, by_name]

- id: lookup_008
  category: lookup
  query: "What did Ravi Kumar work on recently?"
  expected:
    intent: lookup
    operations_required: [find, traverse, resolve]
    answer_must_contain: ["INC0012345", "INC0012348"]
  tags: [single_hop, assigned_to]

