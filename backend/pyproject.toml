[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "itsm-bridge"
version = "0.1.0"
description = "Natural-language mediation layer over ServiceNow-shaped IT data"
requires-python = ">=3.12,<3.13"
authors = [{ name = "Aditya Kamat" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "networkx>=3.3",
    "faiss-cpu>=1.9",
    "sentence-transformers>=3.3",
    "anthropic>=0.40",
    "openai>=1.55",
    "mcp>=1.1",
    "structlog>=24.4",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "python-multipart>=0.0.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-PyYAML",
]

[project.scripts]
itsm-bridge-mcp = "src.mcp_server.server:main_stdio"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "eval*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "real_llm: marks tests that hit real LLM APIs (deselect with '-m \"not real_llm\"')",
    "integration: marks integration tests (deselect with '-m \"not integration\"')",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
# FastAPI's `Depends(...)` and `Header(...)` are idiomatic in default args.
"src/api/routes/*" = ["B008"]
