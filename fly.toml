app = "itsm-bridge-backend"
primary_region = "ord"

[build]
  dockerfile = "Dockerfile"

[env]
  LLM_PROVIDER = "anthropic"
  MODEL_PLANNER = "claude-sonnet-4-6"
  MODEL_RESPONSE = "claude-haiku-4-5"
  MODEL_PREPROCESSOR = "claude-haiku-4-5"
  EMBEDDING_MODEL = "all-MiniLM-L6-v2"
  RATE_LIMIT_PER_MIN = "60"
  CORS_ALLOWED_ORIGINS = "https://atomic-bridge.vercel.app,http://localhost:3000,http://localhost:6274,http://127.0.0.1:6274"
  HF_HUB_DISABLE_SYMLINKS_WARNING = "1"

# FastAPI on 8000 — public HTTPS via Fly's edge.
[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 20
    hard_limit = 25

  [[http_service.checks]]
    grace_period = "120s"
    interval = "15s"
    method = "GET"
    timeout = "5s"
    path = "/health"

# MCP SSE on 8001 — separate TCP service, TLS-terminated by Fly's edge.
# Reachable at https://itsm-bridge-backend.fly.dev:8001/sse
[[services]]
  internal_port = 8001
  protocol = "tcp"

  [[services.ports]]
    port = 8001
    handlers = ["tls"]

  [[services.tcp_checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "120s"

[[mounts]]
  source = "itsm_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "2048mb"
