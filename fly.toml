app = "itsm-bridge-backend"
primary_region = "ord"

[build]
  dockerfile = "Dockerfile"

[env]
  LLM_PROVIDER = "anthropic"
  MODEL_PLANNER = "claude-sonnet-4-6"
  MODEL_RESPONSE = "claude-haiku-4-5"
  MODEL_PREPROCESSOR = "claude-haiku-4-5"
  EMBEDDING_MODEL = "all-MiniLM-L6-v2"
  RATE_LIMIT_PER_MIN = "60"
  CORS_ALLOWED_ORIGINS = "https://itsm-bridge.vercel.app,http://localhost:3000"
  HF_HUB_DISABLE_SYMLINKS_WARNING = "1"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "requests"
    soft_limit = 20
    hard_limit = 25

  # Generous grace period — first cold boot loads the sentence-transformers
  # model from /home/app/.cache (~5-15s). Don't kill the machine before then.
  [[http_service.checks]]
    grace_period = "120s"
    interval = "15s"
    method = "GET"
    timeout = "5s"
    path = "/health"

[[mounts]]
  source = "itsm_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "2048mb"
